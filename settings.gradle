stonecutter {
    kotlinController = false
    centralScript = "build-fabric.gradle"

    create(getRootProject()) {
        versions [
            // fabric
            "1.21.1-fabric" : "1.21.1",
            "1.21.2-fabric" : "1.21.2",
            "1.21.3-fabric" : "1.21.3",
            "1.21.4-fabric" : "1.21.4",
            "1.21.5-fabric" : "1.21.5",
            "1.21.6-fabric" : "1.21.6",
            "1.21.7-fabric" : "1.21.7",
            "1.21.8-fabric" : "1.21.8",
            "1.21.9-fabric" : "1.21.9",
            "1.21.10-fabric": "1.21.10",
            "1.21.11-fabric": "1.21.11",
            "26.1-fabric"   : "26.1",
            "26.1.1-fabric" : "26.1.1",
            "26.1.2-fabric" : "26.1.2",
            "26.2-fabric"   : "26.2",
            "26.3-fabric"   : "26.3",
            // forge (no 26.1, its forge build crashes for everyone; forge skipped 1.21.2)
            "1.21.1-forge"  : "1.21.1",
            "1.21.3-forge"  : "1.21.3",
            "1.21.4-forge"  : "1.21.4",
            "1.21.5-forge"  : "1.21.5",
            "1.21.6-forge"  : "1.21.6",
            "1.21.7-forge"  : "1.21.7",
            "1.21.8-forge"  : "1.21.8",
            "1.21.9-forge"  : "1.21.9",
            "1.21.10-forge" : "1.21.10",
            "1.21.11-forge" : "1.21.11",
            "26.1.1-forge"  : "26.1.1",
            "26.1.2-forge"  : "26.1.2",
            "26.2-forge"    : "26.2",
            "26.3-forge"    : "26.3",
        ]

        // loom for fabric nodes, ForgeGradle for forge nodes
        mapBuilds { branch, node ->
            def loader = node.project.substring(node.project.lastIndexOf('-') + 1)
            ("build-" + loader + ".gradle").toString()
        }

        vcsVersion = "26.3-fabric"
    }
}

rootProject.name = "betterf3c"
